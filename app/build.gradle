plugins {
    id 'com.android.application'
}

android {
    namespace 'app.tvunsplash'
    compileSdk 34

    defaultConfig {
        applicationId 'app.tvunsplash'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published to a store: signed with your local debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only (never in the APK): plain JVM tests for the time slots, src/test.
    testImplementation 'junit:junit:4.13.2'
}
